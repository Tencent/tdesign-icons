name: tdesign_flutter_icons
description: "TDesign Icons for Flutter."
version: 0.0.6
homepage: https://tdesign.tencent.com/icons
repository: https://github.com/Tencent/tdesign-icons/tree/develop/packages/flutter
issue_tracker: https://github.com/Tencent/tdesign-icons/issues
topics:
  - assets
  - icons
  - tdesign
  - symbol
include:
  - lib/
  - fonts/
  - LICENSE
  - README.md

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  code_builder: ^4.11.1
  dart_style: ^3.1.2

flutter:
  fonts:
    - family: TIcons
      fonts:
        - asset: fonts/t.ttf
