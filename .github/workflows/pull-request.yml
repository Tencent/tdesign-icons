name: MAIN_PULL_REQUEST

on:
  pull_request:
    branches: [develop, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: check_github_primary_email
        run: |
          # 获取最新提交的作者邮箱和提交者邮箱
          log_emails=$(git log --pretty=format:"%ae %ce" -1)
          # 如果邮箱包含 'tdesign@tencent.com'，跳过验证
          if [[ ${log_emails} =~ 'tdesign@tencent.com' ]];then 
              echo "$log_emails 跳过验证"
              exit 0
          fi
          # 如果邮箱包含 '@tencent.com'，校验失败，提示用户更改邮箱
          if [[ ${log_emails} =~ '@tencent.com' ]];then 
              echo "默认邮箱 $log_emails 校验非法，可以去 https://github.com/settings/emails 更改" 
              exit 2;
          else 
              # 否则，校验通过
              echo "邮箱 $log_emails 校验通过";
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: check_local_email
        run: |
          # 获取最新提交的作者邮箱和提交者邮箱
          log_emails=$(git log --pretty=format:"%ae %ce" -1)
          # 如果邮箱包含 'tdesign@tencent.com'，跳过验证
          if [[ ${log_emails} =~ 'tdesign@tencent.com' ]];then 
              echo "$log_emails 跳过验证"
              exit 0
          fi
          # 如果邮箱包含 '@tencent.com'，校验失败，提示用户更改本地邮箱
          if [[ ${log_emails} =~ '@tencent.com' ]];then 
              echo "本地提交邮箱 $log_emails 校验非法，需要本地更改重新提交" 
              exit 2;
          else 
              # 否则，校验通过
              echo "邮箱 $log_emails 校验通过";
          fi

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        icons:
          - tdesign-icons-vue
          - tdesign-icons-vue-next
          - tdesign-icons-react
          - tdesign-icons-svg
          - tdesign-icons-view
          - tdesign-icons-web-components

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm run generate

      - run: pnpm run --filter ${{ matrix.icons }} build

  build-flutter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter-version: ["3.32.0", "3.x"]

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm run generate

      - uses: TDesignOteam/workflows/actions/setup-flutter@main
        with:
          flutter-version: ${{ matrix.flutter-version }}

      - name: build and verify flutter package
        working-directory: ./packages/flutter
        run: |
          echo "Flutter ${{ matrix.flutter-version }}"
          flutter --version
          flutter pub get
          dart ./tool/generate.dart

          # 验证
          [ -f "lib/src/assets.g.dart" ] || (echo "❌ assets.g.dart 不存在" && exit 1)
          [ -f "fonts/t.ttf" ] || (echo "❌ t.ttf 不存在" && exit 1)
          icon_count=$(grep -c "static const " lib/src/assets.g.dart || echo "0")
          echo "✅ Flutter 包构建成功，共 $icon_count 个图标"

          flutter analyze
          cd example && flutter pub get && flutter analyze
          cd .. && flutter pub publish --dry-run

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm run generate

      - run: pnpm run --filter tdesign-icons-view preview

      - run: mv packages/view/dist _site

      - run: zip -r _site.zip _site

      - name: upload _site artifact
        uses: actions/upload-artifact@v7
        with:
          name: _site
          path: _site.zip
          retention-days: 5

      - name: Save PR number
        if: always()
        run: echo ${{ github.event.number }} > ./pr-id.txt

      - name: Upload PR number
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr
          path: ./pr-id.txt
