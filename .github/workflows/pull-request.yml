name: MAIN_PULL_REQUEST

on:
  pull_request:
    branches: [develop, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: check_github_primary_email
        run: |
          # 获取最新提交的作者邮箱和提交者邮箱
          log_emails=$(git log --pretty=format:"%ae %ce" -1)
          # 如果邮箱包含 'tdesign@tencent.com'，跳过验证
          if [[ ${log_emails} =~ 'tdesign@tencent.com' ]];then 
              echo "$log_emails 跳过验证"
              exit 0
          fi
          # 如果邮箱包含 '@tencent.com'，校验失败，提示用户更改邮箱
          if [[ ${log_emails} =~ '@tencent.com' ]];then 
              echo "默认邮箱 $log_emails 校验非法，可以去 https://github.com/settings/emails 更改" 
              exit 2;
          else 
              # 否则，校验通过
              echo "邮箱 $log_emails 校验通过";
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: check_local_email
        run: |
          # 获取最新提交的作者邮箱和提交者邮箱
          log_emails=$(git log --pretty=format:"%ae %ce" -1)
          # 如果邮箱包含 'tdesign@tencent.com'，跳过验证
          if [[ ${log_emails} =~ 'tdesign@tencent.com' ]];then 
              echo "$log_emails 跳过验证"
              exit 0
          fi
          # 如果邮箱包含 '@tencent.com'，校验失败，提示用户更改本地邮箱
          if [[ ${log_emails} =~ '@tencent.com' ]];then 
              echo "本地提交邮箱 $log_emails 校验非法，需要本地更改重新提交" 
              exit 2;
          else 
              # 否则，校验通过
              echo "邮箱 $log_emails 校验通过";
          fi

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        icons:
          - tdesign-icons-vue
          - tdesign-icons-vue-next
          - tdesign-icons-react
          - tdesign-icons-svg
          - tdesign-icons-view
          - tdesign-icons-web-components

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm run generate

      - if: matrix.icons == 'tdesign-icons-view'
        run: pnpm run --filter tdesign-icons-vue-next build

      - run: pnpm run --if-present --filter ${{ matrix.icons }} build

  build-flutter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.32.0 verifies the minimum supported version; tracks latest stable.
        flutter-version: ["3.32.0", "latest"]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm run generate

      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: ${{ matrix.flutter-version }}

      - name: install Flutter package dependencies
        working-directory: ./packages/flutter
        run: flutter pub get

      - name: generate Flutter icon assets
        working-directory: ./packages/flutter
        run: dart ./tool/generate.dart

      - name: analyze Flutter package
        working-directory: ./packages/flutter
        run: flutter analyze

      - name: dry-run Flutter publish
        working-directory: ./packages/flutter
        run: flutter pub publish --dry-run

      - name: install Flutter example dependencies
        working-directory: ./packages/flutter/example
        run: flutter pub get

      - name: analyze Flutter example
        working-directory: ./packages/flutter/example
        run: flutter analyze

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm run generate

      - run: pnpm run --filter tdesign-icons-vue-next build

      - run: pnpm run --filter tdesign-icons-view preview

      - run: mv packages/view/dist _site

      - uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.32.0

      - name: install Flutter package dependencies
        working-directory: ./packages/flutter
        run: flutter pub get

      - name: generate Flutter icon assets
        working-directory: ./packages/flutter
        run: dart ./tool/generate.dart

      - name: install Flutter example dependencies
        working-directory: ./packages/flutter/example
        run: flutter pub get

      - name: build Flutter Web preview
        working-directory: ./packages/flutter/example
        run: flutter build web --release --no-pub --base-href /flutter/

      - name: build Flutter example APK
        working-directory: ./packages/flutter/example
        run: flutter build apk --release --no-pub

      - name: add Flutter Web preview to site
        run: mv packages/flutter/example/build/web _site/flutter

      - name: upload Flutter example APK
        id: upload-flutter-apk
        uses: actions/upload-artifact@v7
        with:
          name: flutter-example-apk
          path: packages/flutter/example/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          archive: false
          retention-days: 5

      - name: archive preview site
        run: zip -r _site.zip _site

      - name: upload _site artifact
        uses: actions/upload-artifact@v7
        with:
          name: _site
          path: _site.zip
          retention-days: 5

      - name: Save PR number
        if: always()
        run: |
          echo ${{ github.event.number }} > ./pr-id.txt
          echo "${{ steps.upload-flutter-apk.outputs.artifact-url }}" > ./apk-url.txt

      - name: Upload PR preview metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr
          path: |
            ./pr-id.txt
            ./apk-url.txt
