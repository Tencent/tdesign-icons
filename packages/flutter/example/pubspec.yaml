name: tdesign_icons_example
description: "TDesign Icons Flutter 本地开发演示应用"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: ">=3.32.0"

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  tdesign_flutter: 1.0.0-alpha.1
  tdesign_flutter_icons:
    path: ../

dependency_overrides:
  # 本地开发始终使用当前目录的 tdesign_flutter_icons（0.0.6）。
  # tdesign_flutter 1.0.0-alpha.1 依赖 tdesign_flutter_icons ^0.0.5（<0.0.6），
  # 与本地 0.0.6 版本约束冲突，需用 override 强制解析到本地源码。
  tdesign_flutter_icons:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
