name: Flutter Publish

on:
  push:
    tags:
      - 'tdesign_icons-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm run generate

      - uses: TDesignOteam/workflows/actions/setup-flutter@main
        with:
          flutter-version: 3.32.0

      - uses: dart-lang/setup-dart@v1

      - name: Publish tdesign_icons to pub.dev
        working-directory: ./packages/flutter
        run: |
          tag_version="${GITHUB_REF_NAME#tdesign_icons-v}"
          pubspec_version="$(grep '^version:' pubspec.yaml | awk '{print $2}')"

          if [[ "$tag_version" != "$pubspec_version" ]]; then
            echo "Tag version ($tag_version) does not match pubspec.yaml version ($pubspec_version)."
            exit 1
          fi

          flutter pub get
          dart ./tool/generate.dart

          [ -f "lib/src/assets.g.dart" ] || (echo "❌ assets.g.dart 不存在" && exit 1)
          [ -f "fonts/t.ttf" ] || (echo "❌ t.ttf 不存在" && exit 1)

          flutter analyze
          flutter pub publish --dry-run
          flutter pub publish --force
